name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest (모델 YAML·제스처/도구 스키마·조립 엔진·튜터 mock 포함)
        run: uv run pytest -q
      - name: Eval — 도구 호출 (mock, 선택률 90% 미만이면 실패)
        run: uv run python scripts/eval_tool_calls.py --provider mock --min-selection 0.9
        env:
          LLM_PROVIDER: mock
      - name: Eval — 제스처 (합성 녹화 스모크)
        run: uv run python scripts/eval_gestures.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright E2E (실험실 WebGL2 해석기·화면 흐름, SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
